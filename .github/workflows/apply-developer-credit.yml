name: Aplicar crédito centralizado do portfólio

on:
  push:
    paths:
      - .github/workflows/apply-developer-credit.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar alterações
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: esperado 1 trecho, encontrado {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/pages/LandingPage.tsx',
              "import { Link } from 'react-router-dom';\n",
              "import { Link } from 'react-router-dom';\nimport { DeveloperCredit } from '../components';\n",
          )
          replace_once(
              'src/pages/LandingPage.tsx',
              """          <span>
            © 2026 Reserva Fácil · Desenvolvido por Joelcio Maia ·{' '}
            <a href="https://joelciomaia.github.io/" target="_blank" rel="noreferrer">
              Portfólio do desenvolvedor
            </a>
          </span>""",
              """          <DeveloperCredit productName="Reserva Fácil" />""",
          )

          replace_once(
              'src/pages/WeeklySchedulePage.tsx',
              "import { Button, ErrorMessage, Loading } from '../components';",
              "import { Button, DeveloperCredit, ErrorMessage, Loading } from '../components';",
          )
          replace_once(
              'src/pages/WeeklySchedulePage.tsx',
              """      <footer className={styles.developerFooter}>
        <span>© 2026 Lab Reserva · Desenvolvido por Joelcio Maia</span>
        <a href="https://joelciomaia.github.io/" target="_blank" rel="noreferrer">
          Portfólio do desenvolvedor
        </a>
      </footer>""",
              """      <footer className={styles.developerFooter}>
        <DeveloperCredit productName="Reserva Fácil" />
      </footer>""",
          )
          PY

      - run: npm ci
      - run: npm run build
      - run: npm run lint

      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Padroniza crédito pelo portfólio"
          git push
