            };''',
              '''    const params: BootstrapParams = {
              ...(publicSchoolId ? { schoolId: publicSchoolId } : {}),
              ...(preselectedLaboratoryId ? { preselectedLaboratoryId } : {}),
              ...(initialAvailability ? { initialAvailability } : {}),
            };''',
