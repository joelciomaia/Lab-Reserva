            const scheduleUrl =''',
              '''  if (bootstrapError || !data || !laboratory) {
              return (
                <div className={styles.statePage}>
                  <ErrorMessage
                    action={
                      <Button variant="secondary" onClick={reload}>
                        Tentar novamente
