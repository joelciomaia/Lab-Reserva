              return {
                mode: 'snapshot',
                generatedAt: new Date().toISOString(),
                totalServerMs: Date.now() - startedAt,
                timings: timings,
                counts: {
                  dates: dates.length,
                  periods: configuration.periods.length,
                  reservations: reservations.length,
                  cancellations: cancellations.length,
                },
                responseBytes: diagnosticPayloadBytes_(response),
              };
            }

            throwApiError_(
              'VALIDATION_ERROR',
              'O modo de diagnóstico deve ser bootstrap, week ou snapshot.',
              { field: 'mode' },
            );''',
          )

          replace_once(
              'public/diagnostico.html',
              '''          for (const mode of ['bootstrap', 'week']) {''',
              '''          for (const mode of ['snapshot', 'week']) {''',
          )
          replace_once(
              'public/diagnostico.html',
              '''              status.textContent = `Executando ${mode === 'bootstrap' ? 'configuração inicial' : 'disponibilidade semanal'} — tentativa ${attempt} de 3…`;
              const payload = mode === 'bootstrap'
                ? { action: 'diagnostics', mode, school: context.school, lab: context.laboratoryId }
                : { action: 'diagnostics', mode, school: context.school, laboratoryId: context.laboratoryId, dates };''',
              '''              status.textContent = `Executando ${mode === 'snapshot' ? 'abertura completa da agenda' : 'troca de semana'} — tentativa ${attempt} de 3…`;
              const payload = {
                action: 'diagnostics',
                mode,
                school: context.school,
                laboratoryId: context.laboratoryId,
                lab: context.laboratoryId,
                dates,
              };''',
          )
          replace_once(
              'public/diagnostico.html',
              '''        const bootstrapRows = rows.filter((row) => row.mode === 'bootstrap');
              const weekRows = rows.filter((row) => row.mode === 'week');
              const metrics = [
                ['Bootstrap no navegador', `${average(bootstrapRows, (row) => row.browserMs)} ms`],
                ['Bootstrap no servidor', `${average(bootstrapRows, (row) => row.serverMs)} ms`],
                ['Semana no navegador', `${average(weekRows, (row) => row.browserMs)} ms`],
                ['Semana no servidor', `${average(weekRows, (row) => row.serverMs)} ms`],
              ];''',
              '''        const snapshotRows = rows.filter((row) => row.mode === 'snapshot');
              const weekRows = rows.filter((row) => row.mode === 'week');
              const metrics = [
                ['Abertura completa no navegador', `${average(snapshotRows, (row) => row.browserMs)} ms`],
                ['Abertura completa no servidor', `${average(snapshotRows, (row) => row.serverMs)} ms`],
                ['Troca de semana no navegador', `${average(weekRows, (row) => row.browserMs)} ms`],
                ['Troca de semana no servidor', `${average(weekRows, (row) => row.serverMs)} ms`],
              ];''',
          )
          replace_once(
              'public/diagnostico.html',
              '''          return `<tr><td>${row.mode === 'bootstrap' ? 'Configuração inicial' : 'Disponibilidade semanal'}</td><td>${row.attempt}</td><td>${row.browserMs} ms</td><td>${row.serverMs} ms</td><td>${row.outsideServerMs} ms</td><td>${step}: ${duration} ms</td></tr>`;''',
              '''          return `<tr><td>${row.mode === 'snapshot' ? 'Abertura completa' : 'Troca de semana'}</td><td>${row.attempt}</td><td>${row.browserMs} ms</td><td>${row.serverMs} ms</td><td>${row.outsideServerMs} ms</td><td>${step}: ${duration} ms</td></tr>`;''',
          )

          workflow = Path('.github/workflows/apply-agenda-performance-fixes.yml')
          if workflow.exists():
              workflow.unlink()
          PY

