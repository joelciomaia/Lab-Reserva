name: Corrigir aplicador dos ajustes

on:
  push:
    paths:
      - .github/workflows/fix-agenda-patch-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir aplicador
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-agenda-performance-fixes.yml')
          text = path.read_text(encoding='utf-8')
          old = """              if count != 1:\n                  raise RuntimeError(f'{path}: esperado 1 trecho, encontrado {count}')\n              file.write_text(text.replace(old, new, 1), encoding='utf-8')\n"""
          new = """              if count != 1:\n                  if path == 'apps-script/Code.gs' and \"if (action === 'agendaSnapshot')\" in new:\n                      marker = \"    if (action === 'diagnostics') {\"\n                      start = new.index(\"    if (action === 'agendaSnapshot')\")\n                      insertion = new[start:new.index(marker)]\n                      if text.count(marker) != 1:\n                          raise RuntimeError(f'{path}: marcador GET não encontrado')\n                      file.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')\n                      return\n                  if path == 'apps-script/Code.gs' and \"if (payload.action === 'agendaSnapshot')\" in new:\n                      marker = \"  if (payload.action === 'diagnostics') {\"\n                      start = new.index(\"  if (payload.action === 'agendaSnapshot')\")\n                      insertion = new[start:new.index(marker)]\n                      if text.count(marker) != 1:\n                          raise RuntimeError(f'{path}: marcador POST não encontrado')\n                      file.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')\n                      return\n                  raise RuntimeError(f'{path}: esperado 1 trecho, encontrado {count}')\n              file.write_text(text.replace(old, new, 1), encoding='utf-8')\n"""
          if text.count(old) != 1:
              raise RuntimeError('Trecho do helper não encontrado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-agenda-patch-workflow.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige aplicador de ajustes [skip fix]"
          git push
