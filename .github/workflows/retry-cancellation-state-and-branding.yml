name: Reexecutar melhoria de cancelamentos e créditos

on:
  push:
    paths:
      - .github/workflows/retry-cancellation-state-and-branding.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar alterações
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-cancellation-state-and-branding.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = dedent(workflow[start:end])

          fragile_start = source.index('old = """    expect(data).toEqual([')
          fragile_end_marker = 'tests = tests.replace(old, new, 1)'
          fragile_end = source.index(fragile_end_marker, fragile_start) + len(fragile_end_marker)
          robust = '''expected_start = tests.index('    expect(data).toEqual([')
          expected_end = tests.index('    expect(\\n      data.some(', expected_start)
          replacement_expectation = """    expect(data).toEqual([
              { range: "'RESERVAS'!N1", majorDimension: 'ROWS', values: [['AULAS_HORARIOS']] },
              { range: "'RESERVAS'!O1", majorDimension: 'ROWS', values: [['STATUS']] },
              {
                range: "'RESERVAS'!P1",
                majorDimension: 'ROWS',
                values: [['AULAS_CANCELADAS_IDS']],
              },
              { range: "'RESERVAS'!Q1", majorDimension: 'ROWS', values: [['CANCELADO_EM']] },
              { range: "'RESERVAS'!R1", majorDimension: 'ROWS', values: [['CANCELADO_POR']] },
              {
                range: "'RESERVAS'!S1",
                majorDimension: 'ROWS',
                values: [['MOTIVO_CANCELAMENTO']],
              },
              {
                range: "'CANCELAMENTOS'!A1",
                majorDimension: 'ROWS',
                values: [[...GOOGLE_CANCELLATIONS_HEADER]],
              },
            ]);
          """
          tests = tests[:expected_start] + replacement_expectation + tests[expected_end:]
          '''
          source = source[:fragile_start] + robust + source[fragile_end:]
          exec(compile(source, 'cancellation-state-and-branding', 'exec'))
          PY

      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - run: npm run lint

      - name: Publicar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script src index.html
          git commit -m "Otimiza cancelamentos e adiciona créditos"
          git push
