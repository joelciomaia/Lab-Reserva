name: Aplicar correções finais da agenda

on:
  push:
    paths:
      - .github/workflows/apply-agenda-fixes-v5.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar correções
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-agenda-fixes-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = dedent(workflow[start:end])

          old_helper = '''def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: esperado 1 trecho, encontrado {count}')
              write(path, text.replace(old, new, 1))
          '''
          new_helper = r'''def replace_once(path, old, new):
              import re
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return

              tokens = re.split(r'\s+', old.strip())
              flexible_pattern = r'\s+'.join(re.escape(token) for token in tokens if token)
              flexible_matches = list(re.finditer(flexible_pattern, text, flags=re.MULTILINE))
              if len(flexible_matches) == 1:
                  match = flexible_matches[0]
                  write(path, text[:match.start()] + new + text[match.end():])
                  return

              if path == 'apps-script/Support.gs' and 'spreadsheet.getSpreadsheetTimeZone()' in old:
                  replacement = """function sheetDateToIso_(value, spreadsheet, location) {
            if (value instanceof Date && !Number.isNaN(value.getTime())) {
              return Utilities.formatDate(value, 'UTC', 'yyyy-MM-dd');
            }
            var text = optionalText_(value);
            var brazilian = /^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/.exec(text);
            if (brazilian) {
              text = brazilian[3] + '-' + brazilian[2] + '-' + brazilian[1];
            }
            try {
              return assertIsoDate_(text);
            } catch (error) {
              if (isApiError_(error)) {
                throwApiError_('DATA_INTEGRITY_ERROR', location + ' contém uma data inválida.', {
                  location: location,
                });
              }
              throw error;
            }
          }

          """
                  replace_between(path, 'function sheetDateToIso_(value, spreadsheet, location) {', 'function safeSheetText_(value)', replacement)
                  return

              if path == 'apps-script/Support.gs' and old.startswith('function safeSheetText_'):
                  replacement = """function safeSheetText_(value) {
            var text = String(value === null || value === undefined ? '' : value);
            if (/^\\d{4}-\\d{2}-\\d{2}$/.test(text)) {
              return "'" + text;
            }
            return /^[=+\\-@]/.test(text) ? "'" + text : text;
          }

          """
                  replace_between(path, 'function safeSheetText_(value) {', 'function appendImmutableRow_(sheet, values)', replacement)
                  return

              if path == 'apps-script/Reservations.gs' and old.startswith('function readCancellations_'):
                  replacement = """function readCancellations_(spreadsheet) {
            var cancellationSheet = spreadsheet.getSheetByName(CANCELLATIONS_SHEET_NAME_);
            if (!cancellationSheet) {
              throwApiError_('CONFIGURATION_ERROR', 'A aba ' + CANCELLATIONS_SHEET_NAME_ + ' não existe na planilha.', {
                sheet: CANCELLATIONS_SHEET_NAME_,
              });
            }
            if (cancellationSheet.getLastRow() <= 1) {
              return [];
            }
            var table = readTable_(spreadsheet, CANCELLATIONS_SHEET_NAME_, CANCELLATIONS_HEADER_);
            var cancellations = [];
            var seenIds = Object.create(null);
            for (var rowIndex = 0; rowIndex < table.rows.length; rowIndex += 1) {
              var row = table.rows[rowIndex];
              if (rowIsBlank_(row)) continue;
              var location = CANCELLATIONS_SHEET_NAME_ + '!linha ' + (rowIndex + 2);
              var id = cellText_(tableCell_(table, row, 'ID'));
              var reservationId = cellText_(tableCell_(table, row, 'RESERVA_ID'));
              var periodId = cellText_(tableCell_(table, row, 'AULA_ID'));
              if (!id || !reservationId || !periodId) {
                throwApiError_('DATA_INTEGRITY_ERROR', location + ' deve conter ID, RESERVA_ID e AULA_ID.');
              }
              if (seenIds[id]) {
                throwApiError_('DATA_INTEGRITY_ERROR', 'O cancelamento ' + id + ' está repetido.');
              }
              seenIds[id] = true;
              cancellations.push({ id: id, reservationId: reservationId, periodId: periodId });
            }
            return cancellations;
          }

          """
                  replace_between(path, 'function readCancellations_(spreadsheet) {', 'function cancellationKey_(reservationId, periodId)', replacement)
                  return

              if path == 'apps-script/Reservations.gs' and 'spreadsheetForSchool_(school)' in old:
                  function_start = text.index('function createReservation_(school, rawRequest) {')
                  before = text[:function_start]
                  body = text[function_start:]
                  body = body.replace('    var spreadsheet = spreadsheetForSchool_(school);', '    var spreadsheet = spreadsheetForSchoolPublicRead_(school);', 1)
                  body = body.replace('    var configuration = readConfiguration_(spreadsheet);', '    var configuration = readPublicCoreConfiguration_(spreadsheet);\n    assertPublicConfigurationSchool_(configuration, school);', 1)
                  write(path, before + body)
                  return

              if path == 'src/app/BootstrapContext.tsx':
                  if 'getPublicAgendaContext' in old and "../utils/dates" not in text:
                      marker = "import { getFriendlyError } from '../types';"
                      addition = marker + "\nimport { isValidIsoDate } from '../utils/dates';\nimport { getCurrentAgendaReferenceDate, getSchoolWeek } from '../utils/week';"
                      write(path, text.replace(marker, addition, 1))
                      return
                  if 'const shouldLoadPublicData' in old and 'const initialAvailability' not in text:
                      marker = '  const [data, setData] = useState<BootstrapData | null>(null);'
                      block = """  const initialAvailability = useMemo(() => {
            if (isBookingRoute || !preselectedLaboratoryId) {
              return undefined;
            }
            const queryDate = new URLSearchParams(location.search).get('date');
            const referenceDate = isValidIsoDate(queryDate)
              ? new Date(`${queryDate}T12:00:00`)
              : getCurrentAgendaReferenceDate(new Date());
            return {
              laboratoryId: preselectedLaboratoryId,
              dates: getSchoolWeek(referenceDate).map((day) => day.isoDate),
            };
          }, [isBookingRoute, location.search, preselectedLaboratoryId]);
          """
                      write(path, text.replace(marker, block + marker, 1))
                      return
                  if 'const params: BootstrapParams' in old and '...(initialAvailability ?' not in text:
                      marker = '      ...(preselectedLaboratoryId ? { preselectedLaboratoryId } : {}),'
                      write(path, text.replace(marker, marker + '\n      ...(initialAvailability ? { initialAvailability } : {}),', 1))
                      return
                  if 'client,' in old and 'isManagerRoute' in old:
                      marker = '    client,\n    isManagerRoute,'
                      write(path, text.replace(marker, '    client,\n    initialAvailability,\n    isManagerRoute,', 1))
                      return

              raise RuntimeError(f'{path}: esperado 1 trecho, encontrado {count}')
          '''
          if source.count(old_helper) != 1:
              raise RuntimeError('Não foi possível adaptar o aplicador v2.')
          source = source.replace(old_helper, new_helper, 1)
          exec(compile(source, 'apply-agenda-fixes-v2', 'exec'))
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Validar compilação
        run: npm run build

      - name: Publicar correções
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script src
          git commit -m "Corrige data e reduz espera da agenda"
          git push
