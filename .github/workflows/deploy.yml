name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependências
        run: npm ci

      - name: Compilar projeto
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: 357415328397-fjcaahml2m3bosq8927nbf14rg1oo7b4.apps.googleusercontent.com
          VITE_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbxPjBrnUQO7odOzdlsRneDeLN7EKQfEFSZ-B8qplOKdjBMtGyLqFZTTmwC9aEVWJ-Ml8Q/exec
          VITE_GOOGLE_APPS_SCRIPT_ACCOUNT_EMAIL: joelciomaia@hotmail.com
          VITE_PUBLIC_APP_URL: https://joelciomaia.github.io/Lab-Reserva/

      - name: Enviar arquivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
