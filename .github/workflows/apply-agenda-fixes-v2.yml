name: Executar correções de data e desempenho

on:
  push:
    paths:
      - .github/workflows/apply-agenda-fixes-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar correções
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: esperado 1 trecho, encontrado {count}')
              write(path, text.replace(old, new, 1))

          def replace_between(path, start_marker, end_marker, replacement):
              text = read(path)
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              write(path, text[:start] + replacement + text[end:])

          # Uma única leitura inicial devolve identidade, horários e semana.
          write('apps-script/FastPublicData.gs', '''function readPublicCoreConfiguration_(spreadsheet) {
            var settingsTable = readTable_(spreadsheet, 'CONFIGURACOES', ['CHAVE', 'VALOR']);
            var laboratoriesTable = readTable_(spreadsheet, 'LABORATORIOS', ['ID', 'NOME', 'ATIVO']);
            var shiftsTable = readTable_(spreadsheet, 'TURNOS', [
              'ID',
              'NOME',
              'HORA_INICIO',
              'DURACAO_AULA',
              'QUANTIDADE_AULAS',
              'INTERVALO_APOS',
              'DURACAO_INTERVALO',
              'DIAS_SEMANA',
              'ATIVO',
            ]);

            var settings = settingsMap_(settingsTable);
            var laboratories = readLaboratories_(laboratoriesTable);
            var shifts = readShifts_(shiftsTable);

            return {
              school: {
                id: optionalText_(settings.ID_ESCOLA),
                name: optionalText_(settings.NOME_ESCOLA),
              },
              laboratories: laboratories,
              shifts: shifts,
              periods: createPeriods_(shifts),
              revision: digest_([
                settingsTable.rawValues,
                laboratoriesTable.rawValues,
                shiftsTable.rawValues,
              ]),
            };
          }

          function readAvailabilityConfiguration_(spreadsheet) {
            var laboratoriesTable = readTable_(spreadsheet, 'LABORATORIOS', ['ID', 'NOME', 'ATIVO']);
            var shiftsTable = readTable_(spreadsheet, 'TURNOS', [
              'ID',
              'NOME',
              'HORA_INICIO',
              'DURACAO_AULA',
              'QUANTIDADE_AULAS',
              'INTERVALO_APOS',
              'DURACAO_INTERVALO',
              'DIAS_SEMANA',
              'ATIVO',
            ]);
            var laboratories = readLaboratories_(laboratoriesTable);
            var shifts = readShifts_(shiftsTable);

            return {
              laboratories: laboratories,
              shifts: shifts,
              periods: createPeriods_(shifts),
            };
          }

          function readPublicBookingOptions_(spreadsheet) {
            var settingsTable = readTable_(spreadsheet, 'CONFIGURACOES', ['CHAVE', 'VALOR']);
            var subjectsTable = readTable_(spreadsheet, 'DISCIPLINAS', ['ID', 'NOME', 'ATIVO']);
            var classGroupsTable = readTable_(spreadsheet, 'TURMAS', [
              'ID',
              'NOME',
              'ETAPA',
              'QUANTIDADE_ALUNOS',
              'ATIVO',
            ]);
            var resourcesTable = readTable_(spreadsheet, 'RECURSOS', ['ID', 'NOME', 'ATIVO']);
            var settings = settingsMap_(settingsTable);

            return {
              subjects: readSimpleOptions_(subjectsTable, 'disciplina'),
              classGroups: readClassGroups_(classGroupsTable),
              resources: readSimpleOptions_(resourcesTable, 'recurso'),
              bookingForm: {
                showObservations: booleanCell_(
                  settings.EXIBIR_OBSERVACOES,
                  'CONFIGURACOES (EXIBIR_OBSERVACOES)',
                  false,
                ),
              },
              optionsRevision: digest_([
                settingsTable.rawValues,
                subjectsTable.rawValues,
                classGroupsTable.rawValues,
                resourcesTable.rawValues,
              ]),
            };
          }

          function activePublicLaboratories_(configuration) {
            return configuration.laboratories
              .filter(function (laboratory) {
                return laboratory.active;
              })
              .map(function (laboratory) {
                return {
                  id: laboratory.id,
                  name: laboratory.name,
                  active: laboratory.active,
                };
              });
          }

          function assertPublicConfigurationSchool_(configuration, school) {
            var normalizedSchool = schoolId_(school, 'school', 'VALIDATION_ERROR');
            if (configuration.school.id !== normalizedSchool) {
              throwApiError_(
                'SPREADSHEET_UNAVAILABLE',
                'A configuração publicada não corresponde a esta escola.',
              );
            }
            return normalizedSchool;
          }

          function buildFastBootstrapData_(spreadsheet, configuration, preselectedLaboratoryId) {
            var data = {
              school: configuration.school,
              laboratories: activePublicLaboratories_(configuration),
              periods: configuration.periods,
              classGroups: [],
              subjects: [],
              resources: [],
              bookingForm: { showObservations: false },
              configurationRevision: configuration.revision,
              sourceSpreadsheetFingerprint: spreadsheetBindingFingerprint_(spreadsheet),
            };

            if (preselectedLaboratoryId && activeLaboratory_(configuration, preselectedLaboratoryId)) {
              data.preselectedLaboratoryId = preselectedLaboratoryId;
            }
            return data;
          }

          function getFastBootstrapData_(school, preselectedLaboratoryId) {
            var spreadsheet = spreadsheetForSchoolPublicRead_(school);
            var configuration = readPublicCoreConfiguration_(spreadsheet);
            assertPublicConfigurationSchool_(configuration, school);
            return buildFastBootstrapData_(spreadsheet, configuration, preselectedLaboratoryId);
          }

          function getBookingOptionsData_(school) {
            var spreadsheet = spreadsheetForSchoolPublicRead_(school);
            return readPublicBookingOptions_(spreadsheet);
          }

          function fastAvailabilityContextFromSpreadsheet_(spreadsheet, laboratoryId, configuration) {
            var laboratory = activeLaboratory_(configuration, laboratoryId);
            if (!laboratory) {
              throwApiError_('LABORATORY_NOT_FOUND', 'Laboratório não encontrado ou inativo.');
            }

            return {
              configuration: configuration,
              laboratory: laboratory,
              reservations: readReservations_(spreadsheet),
              cancelled: cancellationSet_(readCancellations_(spreadsheet)),
            };
          }

          function fastAvailabilityContext_(school, laboratoryId) {
            var spreadsheet = spreadsheetForSchoolPublicRead_(school);
            var configuration = readAvailabilityConfiguration_(spreadsheet);
            return fastAvailabilityContextFromSpreadsheet_(spreadsheet, laboratoryId, configuration);
          }

          function getFastAvailability_(school, request) {
            var laboratoryId = requiredText_(request.laboratoryId, 'laboratoryId', 128);
            var date = assertIsoDate_(request.date);
            var context = fastAvailabilityContext_(school, laboratoryId);
            return buildAvailabilityResponse_(context, laboratoryId, date);
          }

          function getFastWeekAvailability_(school, request) {
            var laboratoryId = requiredText_(request.laboratoryId, 'laboratoryId', 128);
            var dates = validateAvailabilityDates_(request.dates);
            var context = fastAvailabilityContext_(school, laboratoryId);

            return dates.map(function (date) {
              return buildAvailabilityResponse_(context, laboratoryId, date);
            });
          }

          function getAgendaSnapshot_(school, request) {
            var laboratoryId = requiredText_(request.laboratoryId, 'laboratoryId', 128);
            var dates = validateAvailabilityDates_(request.dates);
            var spreadsheet = spreadsheetForSchoolPublicRead_(school);
            var configuration = readPublicCoreConfiguration_(spreadsheet);
            assertPublicConfigurationSchool_(configuration, school);
            var context = fastAvailabilityContextFromSpreadsheet_(
              spreadsheet,
              laboratoryId,
              configuration,
            );

            return {
              bootstrap: buildFastBootstrapData_(spreadsheet, configuration, laboratoryId),
              availability: dates.map(function (date) {
                return buildAvailabilityResponse_(context, laboratoryId, date);
              }),
            };
          }
          ''')

          support_replacement = '''function registeredSpreadsheetForSchool_(school) {
            var normalizedSchoolId = schoolId_(school, 'school', 'VALIDATION_ERROR');
            var properties = PropertiesService.getScriptProperties();
            var spreadsheetId = optionalText_(
              properties.getProperty(schoolRegistryPropertyKey_(normalizedSchoolId)),
            );
            if (!spreadsheetId || spreadsheetId.length > 256 || !/^[A-Za-z0-9_-]+$/.test(spreadsheetId)) {
              throwApiError_(
                'SPREADSHEET_UNAVAILABLE',
                'O espaço da escola não foi encontrado ou ainda não foi publicado.',
              );
            }

            var reverseSchoolId = optionalText_(
              properties.getProperty(spreadsheetRegistryPropertyKey_(spreadsheetId)),
            );
            if (reverseSchoolId !== normalizedSchoolId) {
              throwApiError_(
                'SPREADSHEET_UNAVAILABLE',
                'O espaço da escola não está disponível ou perdeu o vínculo publicado.',
              );
            }

            return {
              schoolId: normalizedSchoolId,
              spreadsheet: openRegisteredSpreadsheet_(spreadsheetId),
            };
          }

          function spreadsheetForSchoolPublicRead_(school) {
            return registeredSpreadsheetForSchool_(school).spreadsheet;
          }

          function spreadsheetForSchool_(school) {
            var registered = registeredSpreadsheetForSchool_(school);
            assertSpreadsheetSchool_(registered.spreadsheet, registered.schoolId);
            return registered.spreadsheet;
          }

          '''
          replace_between(
              'apps-script/Support.gs',
              'function spreadsheetForSchool_(school) {',
              'function backendAccountEmail_()',
              support_replacement,
          )

          replace_once(
              'apps-script/Support.gs',
              '''  if (value instanceof Date && !Number.isNaN(value.getTime())) {
            return Utilities.formatDate(
              value,
              spreadsheet.getSpreadsheetTimeZone() || Session.getScriptTimeZone(),
              'yyyy-MM-dd',
            );
          }''',
              '''  if (value instanceof Date && !Number.isNaN(value.getTime())) {
            // Datas da agenda representam somente o dia, não um instante.
            return Utilities.formatDate(value, 'UTC', 'yyyy-MM-dd');
          }''',
          )

          replace_once(
              'apps-script/Support.gs',
              '''function safeSheetText_(value) {
            var text = String(value === null || value === undefined ? '' : value);
            return /^[=+\\-@]/.test(text) ? "'" + text : text;
          }''',
              '''function safeSheetText_(value) {
            var text = String(value === null || value === undefined ? '' : value);
            // Impede o Sheets de converter uma data ISO em objeto Date e deslocar o dia.
            if (/^\\d{4}-\\d{2}-\\d{2}$/.test(text)) {
              return "'" + text;
            }
            return /^[=+\\-@]/.test(text) ? "'" + text : text;
          }''',
          )

          replace_once(
              'apps-script/Reservations.gs',
              '''function readCancellations_(spreadsheet) {
            var table = readTable_(spreadsheet, CANCELLATIONS_SHEET_NAME_, CANCELLATIONS_HEADER_);''',
              '''function readCancellations_(spreadsheet) {
            var cancellationSheet = spreadsheet.getSheetByName(CANCELLATIONS_SHEET_NAME_);
            if (!cancellationSheet) {
              throwApiError_('CONFIGURATION_ERROR', 'A aba ' + CANCELLATIONS_SHEET_NAME_ + ' não existe na planilha.', {
                sheet: CANCELLATIONS_SHEET_NAME_,
              });
            }
            if (cancellationSheet.getLastRow() <= 1) {
              return [];
            }
            var table = readTable_(spreadsheet, CANCELLATIONS_SHEET_NAME_, CANCELLATIONS_HEADER_);''',
          )

          replace_once(
              'apps-script/Reservations.gs',
              '''    var spreadsheet = spreadsheetForSchool_(school);
            ensureOperationalSheetsUnlocked_(spreadsheet);
            var configuration = readConfiguration_(spreadsheet);''',
              '''    var spreadsheet = spreadsheetForSchoolPublicRead_(school);
            ensureOperationalSheetsUnlocked_(spreadsheet);
            var configuration = readPublicCoreConfiguration_(spreadsheet);
            assertPublicConfigurationSchool_(configuration, school);''',
          )

          code = read('apps-script/Code.gs')
          if "action === 'agendaSnapshot'" not in code:
              marker = "    if (action === 'diagnostics') {"
              insertion = '''    if (action === 'agendaSnapshot') {
            return getAgendaSnapshot_(requiredQueryParameter_(parameters, 'school'), {
              laboratoryId: requiredQueryParameter_(parameters, 'laboratoryId'),
              dates: splitList_(requiredQueryParameter_(parameters, 'dates')),
            });
          }

          '''
              if code.count(marker) != 1:
                  raise RuntimeError('Code.gs: marcador GET não encontrado')
              code = code.replace(marker, insertion + marker, 1)
          if "payload.action === 'agendaSnapshot'" not in code:
              marker = "  if (payload.action === 'diagnostics') {"
              insertion = '''  if (payload.action === 'agendaSnapshot') {
            return getAgendaSnapshot_(requiredText_(payload.school, 'school', 128), {
              laboratoryId: requiredText_(payload.laboratoryId, 'laboratoryId', 128),
              dates: Array.isArray(payload.dates)
                ? payload.dates
                : splitList_(requiredText_(payload.dates, 'dates', 512)),
            });
          }

          '''
              if code.count(marker) != 1:
                  raise RuntimeError('Code.gs: marcador POST não encontrado')
              code = code.replace(marker, insertion + marker, 1)
          write('apps-script/Code.gs', code)

          replace_once(
              'src/types/backend.ts',
              '''export interface BootstrapParams {
            /** Identificador público e imutável da escola usada como workspace. */
            schoolId?: string;
            preselectedLaboratoryId?: string;
          }''',
              '''export interface InitialAvailabilityRequest {
            laboratoryId: string;
            dates: string[];
          }

          export interface BootstrapParams {
            /** Identificador público e imutável da escola usada como workspace. */
            schoolId?: string;
            preselectedLaboratoryId?: string;
            /** Dados da semana devolvidos junto com a abertura, consumidos uma única vez. */
            initialAvailability?: InitialAvailabilityRequest;
          }''',
          )

          replace_once(
              'src/services/appsScriptBackend.ts',
              '''type ApiEnvelope<T> = ApiSuccess<T> | ApiFailure;

          interface AvailabilityWaiter {''',
              '''type ApiEnvelope<T> = ApiSuccess<T> | ApiFailure;

          interface AgendaSnapshotResponse {
            bootstrap: BootstrapData;
            availability: AvailabilityResponse[];
          }

          interface AvailabilityWaiter {''',
          )
          replace_once(
              'src/services/appsScriptBackend.ts',
              '''  private readonly fetchImplementation: typeof window.fetch | undefined;
            private readonly pendingAvailabilityBatches = new Map<string, PendingAvailabilityBatch>();''',
              '''  private readonly fetchImplementation: typeof window.fetch | undefined;
            private readonly pendingAvailabilityBatches = new Map<string, PendingAvailabilityBatch>();
            private readonly initialAvailability = new Map<string, AvailabilityResponse>();''',
          )
          replace_once(
              'src/services/appsScriptBackend.ts',
              '''  private availabilityBatchKey(schoolId: string, laboratoryId: string): string {
              return `${schoolId}\\u0000${laboratoryId}`;
            }''',
              '''  private availabilityKey(schoolId: string, laboratoryId: string, date: string): string {
              return `${schoolId}\\u0000${laboratoryId}\\u0000${date}`;
            }

            private availabilityBatchKey(schoolId: string, laboratoryId: string): string {
              return `${schoolId}\\u0000${laboratoryId}`;
            }''',
          )
          replace_once(
              'src/services/appsScriptBackend.ts',
              '''  getBootstrapData(params: BootstrapParams = {}): Promise<BootstrapData> {
              return this.get<BootstrapData>({
                action: 'bootstrap',
                school: requirePublicSchoolId(params.schoolId),
                lab: params.preselectedLaboratoryId,
              });
            }

            getAvailability(request: AvailabilityRequest): Promise<AvailabilityResponse> {
              const schoolId = requirePublicSchoolId(request.schoolId);

              return new Promise<AvailabilityResponse>((resolve, reject) => {''',
              '''  async getBootstrapData(params: BootstrapParams = {}): Promise<BootstrapData> {
              const schoolId = requirePublicSchoolId(params.schoolId);
              const initial = params.initialAvailability;

              if (!initial || initial.dates.length === 0) {
                return this.get<BootstrapData>({
                  action: 'bootstrap',
                  school: schoolId,
                  lab: params.preselectedLaboratoryId,
                });
              }

              const snapshot = await this.get<AgendaSnapshotResponse>({
                action: 'agendaSnapshot',
                school: schoolId,
                laboratoryId: initial.laboratoryId,
                dates: initial.dates.join(','),
              });
              snapshot.availability.map(normalizeAvailabilityResponse).forEach((response) => {
                this.initialAvailability.set(
                  this.availabilityKey(schoolId, response.laboratoryId, response.date),
                  response,
                );
              });
              return snapshot.bootstrap;
            }

            getAvailability(request: AvailabilityRequest): Promise<AvailabilityResponse> {
              const schoolId = requirePublicSchoolId(request.schoolId);
              const initialKey = this.availabilityKey(schoolId, request.laboratoryId, request.date);
              const initialResponse = this.initialAvailability.get(initialKey);
              if (initialResponse) {
                this.initialAvailability.delete(initialKey);
                return Promise.resolve(initialResponse);
              }

              return new Promise<AvailabilityResponse>((resolve, reject) => {''',
          )

          replace_once(
              'src/app/BootstrapContext.tsx',
              '''import { getFriendlyError } from '../types';
          import { getPublicAgendaContext, hasPublicAgendaContext } from './publicAgendaContext';''',
              '''import { getFriendlyError } from '../types';
          import { isValidIsoDate } from '../utils/dates';
          import { getCurrentAgendaReferenceDate, getSchoolWeek } from '../utils/week';
          import { getPublicAgendaContext, hasPublicAgendaContext } from './publicAgendaContext';''',
          )
          replace_once(
              'src/app/BootstrapContext.tsx',
              '''  const shouldLoadPublicData =
              location.pathname === '/agendar' ||
              (location.pathname === '/' && hasPublicAgendaContext(location.search, window.location.search));
            const [data, setData] = useState<BootstrapData | null>(null);''',
              '''  const shouldLoadPublicData =
              location.pathname === '/agendar' ||
              (location.pathname === '/' && hasPublicAgendaContext(location.search, window.location.search));
            const initialAvailability = useMemo(() => {
              if (isBookingRoute || !preselectedLaboratoryId) {
                return undefined;
              }

              const queryDate = new URLSearchParams(location.search).get('date');
              const referenceDate = isValidIsoDate(queryDate)
                ? new Date(`${queryDate}T12:00:00`)
                : getCurrentAgendaReferenceDate(new Date());
              return {
                laboratoryId: preselectedLaboratoryId,
                dates: getSchoolWeek(referenceDate).map((day) => day.isoDate),
              };
            }, [isBookingRoute, location.search, preselectedLaboratoryId]);
            const [data, setData] = useState<BootstrapData | null>(null);''',
          )
          replace_once(
              'src/app/BootstrapContext.tsx',
              '''    const params: BootstrapParams = {
              ...(publicSchoolId ? { schoolId: publicSchoolId } : {}),
              ...(preselectedLaboratoryId ? { preselectedLaboratoryId } : {}),
            };''',
              '''    const params: BootstrapParams = {
              ...(publicSchoolId ? { schoolId: publicSchoolId } : {}),
              ...(preselectedLaboratoryId ? { preselectedLaboratoryId } : {}),
              ...(initialAvailability ? { initialAvailability } : {}),
            };''',
          )
          replace_once(
              'src/app/BootstrapContext.tsx',
              '''    client,
              isManagerRoute,
              preselectedLaboratoryId,''',
              '''    client,
              initialAvailability,
              isManagerRoute,
              preselectedLaboratoryId,''',
          )

          replace_once(
              'src/pages/WeeklySchedulePage.tsx',
              '''  const headingRef = useRef<HTMLHeadingElement>(null);
            const [weekRequest, setWeekRequest] = useState<WeekRequestState>({''',
              '''  const headingRef = useRef<HTMLHeadingElement>(null);
            const pendingRequestKeyRef = useRef('');
            const [weekRequest, setWeekRequest] = useState<WeekRequestState>({''',
          )
          replace_once(
              'src/pages/WeeklySchedulePage.tsx',
              '''  const weekDays = useMemo(() => getSchoolWeek(referenceDate), [referenceDate]);
            const weekStart = startOfWeek(referenceDate, { weekStartsOn: 1 });
            const weekLabel = formatWeekRange(weekStart);
            const requestKey = `${data?.school.id ?? ''}:${laboratory?.id ?? ''}:${weekDays.map((day) => day.isoDate).join(',')}:${requestVersion}`;''',
              '''  const schoolId = data?.school.id ?? '';
            const laboratoryId = laboratory?.id ?? '';
            const weekDays = useMemo(() => getSchoolWeek(referenceDate), [referenceDate]);
            const weekStart = startOfWeek(referenceDate, { weekStartsOn: 1 });
            const weekLabel = formatWeekRange(weekStart);
            const requestKey = `${schoolId}:${laboratoryId}:${weekDays.map((day) => day.isoDate).join(',')}:${requestVersion}`;''',
          )
          replace_once(
              'src/pages/WeeklySchedulePage.tsx',
              '''  useEffect(() => {
              if (!data || !laboratory) {
                return;
              }

              let isCurrent = true;

              void Promise.all(
                weekDays.map((day) =>
                  client.getAvailability({
                    schoolId: data.school.id,
                    laboratoryId: laboratory.id,
                    date: day.isoDate,
                  }),
                ),
              )
                .then((responses) => {
                  if (isCurrent) {
                    setWeekRequest({ key: requestKey, data: responses, error: null });
                  }
                })
                .catch((error: unknown) => {
                  if (isCurrent) {
                    setWeekRequest({ key: requestKey, data: [], error: getFriendlyError(error) });
                  }
                });

              return () => {
                isCurrent = false;
              };
            }, [client, data, laboratory, requestKey, weekDays]);''',
              '''  useEffect(() => {
              if (
                !schoolId ||
                !laboratoryId ||
                weekRequest.key === requestKey ||
                pendingRequestKeyRef.current === requestKey
              ) {
                return;
              }

              let isCurrent = true;
              pendingRequestKeyRef.current = requestKey;

              void Promise.all(
                weekDays.map((day) =>
                  client.getAvailability({
                    schoolId,
                    laboratoryId,
                    date: day.isoDate,
                  }),
                ),
              )
                .then((responses) => {
                  if (isCurrent) {
                    setWeekRequest({ key: requestKey, data: responses, error: null });
                  }
                })
                .catch((error: unknown) => {
                  if (isCurrent) {
                    setWeekRequest({ key: requestKey, data: [], error: getFriendlyError(error) });
                  }
                })
                .finally(() => {
                  if (pendingRequestKeyRef.current === requestKey) {
                    pendingRequestKeyRef.current = '';
                  }
                });

              return () => {
                isCurrent = false;
              };
            }, [client, laboratoryId, requestKey, schoolId, weekDays, weekRequest.key]);''',
          )
          replace_once(
              'src/pages/WeeklySchedulePage.tsx',
              '''  const laboratoryId = laboratory.id;
            const schoolId = data.school.id;
            const publicContext =''',
              '''  const publicContext =''',
          )

          replace_once(
              'src/pages/BookingPage.tsx',
              '''  const headingRef = useRef<HTMLHeadingElement>(null);
            const appliedQueryPeriodRef = useRef<string | null>(null);''',
              '''  const headingRef = useRef<HTMLHeadingElement>(null);
            const appliedQueryDateRef = useRef<string | null>(null);
            const appliedQueryPeriodRef = useRef<string | null>(null);''',
          )
          replace_once(
              'src/pages/BookingPage.tsx',
              '''  useEffect(() => {
              headingRef.current?.focus();
            }, [laboratory]);

            useEffect(() => {
              if (!data || !laboratory || !availabilityKey) {''',
              '''  useEffect(() => {
              headingRef.current?.focus();
            }, [laboratory]);

            useEffect(() => {
              if (!isValidIsoDate(queryDate) || appliedQueryDateRef.current === queryDate) {
                return;
              }

              appliedQueryDateRef.current = queryDate;
              setValue('date', queryDate, { shouldDirty: false, shouldValidate: true });
              setValue('periodIds', [], { shouldDirty: false, shouldValidate: false });
            }, [queryDate, setValue]);

            useEffect(() => {
              if (!data || !laboratory || !availabilityKey) {''',
          )
          replace_once(
              'src/pages/BookingPage.tsx',
              '''      navigate(
                `/?school=${encodeURIComponent(data.school.id)}&lab=${encodeURIComponent(laboratory.id)}`,
                {
                  replace: true,
                  state: { reservationId: reservation.id, reservationDate: reservation.date },
                },
              );''',
              '''      navigate(
                `/?school=${encodeURIComponent(data.school.id)}&lab=${encodeURIComponent(laboratory.id)}&date=${encodeURIComponent(reservation.date)}`,
                {
                  replace: true,
                  state: { reservationId: reservation.id, reservationDate: reservation.date },
                },
              );''',
          )
          replace_once(
              'src/pages/BookingPage.tsx',
              '''  const scheduleUrl = `/?school=${encodeURIComponent(data.school.id)}&lab=${encodeURIComponent(laboratory.id)}&date=${selectedDate}`;''',
              '''  if (isSubmitting) {
              return (
                <div className={styles.statePage}>
                  <Loading
                    label="Salvando agendamento. A agenda será atualizada em instantes…"
                    size="large"
                  />
                </div>
              );
            }

            const scheduleUrl = `/?school=${encodeURIComponent(data.school.id)}&lab=${encodeURIComponent(laboratory.id)}&date=${selectedDate}`;''',
          )
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Validar compilação
        run: npm run build

      - name: Publicar correções
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script src
          git commit -m "Corrige data e reduz espera da agenda"
          git push
