name: Reexecutar melhoria de cancelamentos e créditos v2

on:
  push:
    paths:
      - .github/workflows/retry-cancellation-state-and-branding-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar alterações
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/retry-cancellation-state-and-branding.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = dedent(workflow[start:end])
          exec(compile(source, 'retry-cancellation-state-and-branding', 'exec'))

          test_path = Path('src/integrations/google/googleReservations.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              "url.endsWith('/values:batchUpdate')",
              "url.includes('/values:batchUpdate')",
          )
          test_path.write_text(tests, encoding='utf-8')
          PY

      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - run: npm run lint

      - name: Publicar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script src index.html
          git commit -m "Otimiza cancelamentos e adiciona créditos"
          git push
